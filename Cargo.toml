[package]
name = "sdkmode"
version = "0.4.0"
edition = "2024"
license = "MIT"
build = "build.rs"

[dependencies]
base64 = "0.22"
deno_cache = "0.177.0"
deno_ast = "0.53.1"
deno_core = "0.397.0"
deno_cron = "0.124.0"
deno_crypto = "0.258.0"
deno_error = "0.7.1"
deno_fetch = "0.268.0"
deno_ffi = "0.231.0"
deno_fs = "0.154.0"
deno_http = "0.242.0"
deno_io = "0.154.0"
deno_kv = "0.152.0"
deno_napi = "0.175.0"
deno_net = "0.236.0"
deno_node = "0.182.0"
deno_node_crypto = "0.14.0"
deno_node_sqlite = "0.14.0"
deno_os = "0.61.0"
deno_process = "0.59.0"
deno_resolver = "0.75.0"
deno_runtime = { version = "0.252.0", default-features = false }
deno_telemetry = "0.66.0"
deno_tls = "0.231.0"
deno_web = "0.275.0"
deno_webgpu = "0.211.0"
deno_webidl = "0.244.0"
deno_websocket = "0.249.0"
deno_webstorage = "0.239.0"
icu_calendar = "=2.1.0"
icu_locale = "=2.1.0"
sys_traits = "0.1.27"
anyhow = "1.0.102"
serde_json = "1.0.149"
jsonwebtoken = "9.3"
tokio = { version = "1.51.1", features = ["full"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
url = "2.5.8"
deno_bundle_runtime = "0.31.0"
http = "1.4.0"
http-body-util = "0.1.3"
crossterm = "0.29.0"
ratatui = "0.30.0"
ratatui-textarea = "0.9.2"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
termimad = "0.34.1"
tui-syntax-highlight = { version = "0.2.0", default-features = false, features = ["regex-fancy"] }

[build-dependencies]
deno_cache = "0.177.0"
deno_ast = "0.53.1"
deno_bundle_runtime = "0.31.0"
deno_core = "0.397.0"
deno_cron = "0.124.0"
deno_crypto = "0.258.0"
deno_error = "0.7.1"
deno_fetch = "0.268.0"
deno_ffi = "0.231.0"
deno_fs = "0.154.0"
deno_http = "0.242.0"
deno_io = "0.154.0"
deno_kv = "0.152.0"
deno_napi = "0.175.0"
deno_net = "0.236.0"
deno_node = "0.182.0"
deno_node_crypto = "0.14.0"
deno_node_sqlite = "0.14.0"
deno_os = "0.61.0"
deno_process = "0.59.0"
deno_resolver = "0.75.0"
deno_runtime = { version = "0.252.0", features = ["transpile"] }
deno_telemetry = "0.66.0"
deno_tls = "0.231.0"
deno_web = "0.275.0"
deno_webgpu = "0.211.0"
deno_webidl = "0.244.0"
deno_websocket = "0.249.0"
deno_webstorage = "0.239.0"
sys_traits = "0.1.27"
http = "1.4.0"

[patch.crates-io]
deno_fetch = { path = "vendor/deno_fetch" }
