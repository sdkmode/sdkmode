name: Build

on:
  push:
  pull_request:

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Caches the cargo registry and target/ to speed up later runs.
      - uses: Swatinem/rust-cache@v2

      # aws-lc-sys (pulled in via rustls) needs nasm to build on x86_64.
      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y nasm

      - name: Build (release)
        run: cargo build --release --locked

      - name: Test
        run: cargo test --locked
