# git-cliff configuration — generates a changelog from conventional commits.
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog\n
"""
# Template for each release's section. Commits are grouped by type.
body = """
{% if version %}\
    ## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true

[git]
# Parse commits as conventional commits and drop anything that isn't one.
conventional_commits = true
filter_unconventional = true
split_commits = false

# Map conventional types to changelog sections; order here is display order.
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^doc", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^style", group = "Styling" },
  { message = "^ci", group = "CI" },
  { message = "^build", group = "Build" },
  { message = "^chore\\(release\\):", skip = true },
  { message = "^chore", group = "Miscellaneous" },
  { body = ".*security", group = "Security" },
]

# Only consider tags shaped like v1.2.3.
tag_pattern = "v[0-9]*"
protect_breaking_commits = true
filter_commits = false
topo_order = false
sort_commits = "oldest"
